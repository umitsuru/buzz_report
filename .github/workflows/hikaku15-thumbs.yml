# 参考投稿（hikaku15/posts）が変わったら、サムネイル（thumb/）と一覧用のまとめファイル（bundle.json）を自動で作り直してコミットする
name: hikaku15 thumbnails
on:
  push:
    branches: [main]
    paths: ["hikaku15/posts/**", "!hikaku15/posts/bundle.json", "!hikaku15/posts/*/thumb/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hikaku15-thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python hikaku15/tools/make_thumbs.py
      - run: python hikaku15/tools/make_bundle.py
      - name: commit
        run: |
          git add hikaku15/posts/*/thumb hikaku15/posts/bundle.json
          if git diff --cached --quiet; then echo "nothing to update"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "参考投稿のサムネイルと一覧データ（bundle.json）を自動更新"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

# 参考投稿（hikaku15/posts）に新しい画像が入ったら、サムネイル（thumb/）を自動で作ってコミットする
name: hikaku15 thumbnails
on:
  push:
    branches: [main]
    paths: ["hikaku15/posts/*/img/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hikaku15-thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python hikaku15/tools/make_thumbs.py
      - name: commit
        run: |
          git add hikaku15/posts/*/thumb
          if git diff --cached --quiet; then echo "no new thumbnails"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "参考投稿のサムネイルを自動作成"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
